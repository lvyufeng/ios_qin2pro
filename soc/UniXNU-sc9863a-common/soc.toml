schema_version = 2

[soc]
name = "sc9863a"
description = "UNISOC SC9863A (SharkL3), 8 x Cortex-A55"
# The vendor kernel this description was read out of. Not a build input: the
# device tree here is hand-written from it, not generated.
source_repository = "https://github.com/KevinXu07/android_kernel_qin_qin2pro"
source_revision = "qin2pro-bringup"

# Only what exists and is verified on this SoC. GPU (PowerVR GE8322) has no
# component: Adreno740/AdrenoMetal are Qualcomm-only, and nothing else exists.
[components]
include = ["ArmCpu", "ArmDTPlatform", "ArmVirtPlatform", "SoftwareAES", "XnuPrelink", "DarwinBoot"]